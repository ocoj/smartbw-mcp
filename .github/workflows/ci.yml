name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov ruff cryptography

      - name: ruff（阻断）
        run: python -m ruff check .

      - name: pytest + 覆盖率门槛
        run: python -m pytest -q --cov=. --cov-report=term-missing --cov-fail-under=40
        env:
          PYTHONUNBUFFERED: "1"

  package:
    name: 打包构建（P0-1 防回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel 并校验内容
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          modules = {n for n in names if n.endswith(".py") and "/" not in n}
          expected = {
              "config.py", "crypto_config.py", "mcp_daemon.py", "mcp_raw.py",
              "models.py", "paths.py", "smart_search.py",
              "smartbw_mcp_server.py", "unlock.py",
          }
          missing = expected - modules
          assert not missing, f"wheel 缺少模块: {missing}"
          eps = [n for n in names if n.endswith("entry_points.txt")]
          assert eps, "wheel 缺少 entry_points.txt（console scripts 未安装）"
          ep = zipfile.ZipFile(wheels[0]).read(eps[0]).decode()
          for script in ("smartbw-mcp", "smartbw-daemon"):
              assert script in ep, f"entry_points 缺少 {script}"
          print("wheel 内容校验通过:", sorted(modules))
          PY
