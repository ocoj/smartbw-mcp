[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "smartbw-mcp"
version = "2.3.0"
description = "Vaultwarden 智能代理 — 一行代码获取密码，AI 零门槛使用"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["bitwarden", "vaultwarden", "mcp", "password-manager", "ai"]
authors = [
    {name = "smartbw-mcp contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
smartbw-mcp = "smartbw_mcp_server:main"
smartbw-daemon = "mcp_daemon:main"

[tool.setuptools.py-modules]
# 扁平模块 — 根目录下的 .py 文件，非包目录
modules = [
    "config", "crypto_config", "mcp_daemon", "mcp_raw",
    "models", "smart_search", "smartbw_mcp_server", "unlock",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: 慢速集成测试（需要 Vaultwarden 实例）",
    "network: 需要网络连接的测试",
]

[tool.ruff]
target-version = "py38"
line-length = 100
exclude = ["archive", "old-*", "smart-bitwarden-mcp-backup-*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
known_first_party = ["config", "models", "mcp_raw", "mcp_daemon", "smart_search", "unlock", "crypto_config"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    archive
    | old-
    | smart-bitwarden-mcp-backup-
)/
'''

[tool.coverage.run]
source = ["."]
omit = [
    "archive/*",
    "old-*",
    "smart-bitwarden-mcp-backup-*",
    "tests/*",
    "deploy/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if False:",
]
